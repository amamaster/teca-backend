# Levanta la base de datos del proyecto con un solo comando:
#
#   docker compose up -d
#
# Y para apagarla (los datos se conservan):
#
#   docker compose down

services:
  mongo:
    image: mongo:7
    container_name: teca-mongo
    restart: unless-stopped
    ports:
      # host:contenedor — el backend se conecta a localhost:27017
      - "27017:27017"
    volumes:
      # Volumen con nombre: los datos sobreviven aunque borres el contenedor
      - teca-mongo-data:/data/db
    healthcheck:
      # Marca el contenedor como "healthy" solo cuando Mongo acepta conexiones
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Interfaz web para ver las colecciones y los documentos sin instalar nada.
  # Disponible en http://localhost:8081 — es opcional, solo para desarrollo.
  mongo-express:
    image: mongo-express:1.0.2
    container_name: teca-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  teca-mongo-data:
